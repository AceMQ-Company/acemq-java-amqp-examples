# Every example is compiled and run against a real broker on every push.
#
# This is the whole reason the repository can be trusted. Examples rot: the
# library moves on, the example does not, and a newcomer's first experience is a
# build error. Running them here turns that into a red build instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The library can change without this repository changing at all, so the
  # examples are also run on a schedule. A weekly failure here is how we find out
  # that a released version broke something the documentation still claims.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege for every job that does not ask for more. Without this the
# token gets the repository default, which is an organisation setting somebody
# can change later -- and a workflow whose privileges depend on a setting
# elsewhere is one nobody can review.
permissions:
  contents: read

jobs:
  examples:
    name: run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run every example
        run: mvn -B --no-transfer-progress verify
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7

  tracks-the-release:
    name: the pin is the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than another step above, deliberately. A stale pin
    # and a broken example are different findings and both are worth having: the
    # examples still build and still run no matter what this job says, so a red X
    # here reads as "the pinned version is old", never as "we have no idea
    # whether any of this works".
    #
    # It inherits the workflow's triggers, so it runs on the Monday cron as well
    # as on push. That is the run it exists for. A release moves underneath this
    # repository without a commit landing here, so the only thing that will ever
    # notice is something that looks on a timer.
    steps:
      - uses: actions/checkout@v7

      - name: The pinned library is the newest released one
        # Hard failure rather than a warning, and the argument is worth writing
        # down because the other choice is tempting.
        #
        # This repository exists to prove the current release works. Pinned to an
        # older one it proves something about a version nobody installs any more,
        # and it does that in a green build -- which is worse than no check at
        # all, because a green build is read as an answer. That is not a
        # hypothetical: <acemq.version> sat at 0.7.0 through two releases and was
        # corrected by hand twice, the second time today.
        #
        # The cost of failing hard is real. A library release legitimately lands
        # before the examples are updated, and during that window this job goes
        # red on a repository nobody has broken. But that window is precisely the
        # thing being measured, the fix is a one-line version bump, and a warning
        # buried in a log is exactly what let the window be two releases long.
        #
        # The tags are asked of the library repository directly rather than of a
        # package index: git ls-remote needs no token, which matters for a
        # scheduled run, and the tag is what the release was cut from.
        run: |
          pinned=$(sed -n 's/.*<acemq\.version>\(.*\)<\/acemq\.version>.*/\1/p' pom.xml | head -1)
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-java-amqp \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-java-amqp, so the pin could not be checked"
            exit 1
          fi
          if [ -z "$pinned" ]; then
            echo "::error::no <acemq.version> found in pom.xml, so the pin could not be checked"
            exit 1
          fi

          if [ "$pinned" != "$newest" ]; then
            echo "::error::pom.xml pins acemq-java-amqp $pinned but the newest release is $newest. Edit <acemq.version> in pom.xml and set it to $newest, then run the examples against it."
            exit 1
          fi
          echo "pinned $pinned, which is the newest release"
