# Every example is compiled and run against a real broker on every push.
#
# This is the whole reason the repository can be trusted. Examples rot: the
# library moves on, the example does not, and a newcomer's first experience is a
# build error. Running them here turns that into a red build instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The library can change without this repository changing at all, so the
  # examples are also run on a schedule. A weekly failure here is how we find out
  # that a released version broke something the documentation still claims.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least privilege for every job that does not ask for more. Without this the
# token gets the repository default, which is an organisation setting somebody
# can change later -- and a workflow whose privileges depend on a setting
# elsewhere is one nobody can review.
permissions:
  contents: read

jobs:
  examples:
    name: run the examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run every example
        run: mvn -B --no-transfer-progress verify
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          retention-days: 7

  # Failures only. A green run here is the normal state and would be noise, but a
  # red one on the weekly schedule means a released version broke something the
  # documentation still tells people to do — which nobody would otherwise notice
  # until a newcomer hit it.
  notify:
    needs: examples
    if: always() && needs.examples.result == 'failure'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: failure
      title: >-
        ${{ github.event_name == 'schedule'
            && 'AceMQ examples broke against the published release'
            || 'AceMQ examples are failing' }}
      message: >-
        ${{ github.event_name == 'schedule'
            && 'Nothing changed here, so a released artifact or the documentation it matches has moved underneath them.'
            || 'An example no longer runs. The examples are what a newcomer meets first.' }}
      url: https://github.com/AceMQ-Company/acemq-java-amqp-examples/actions
    secrets: inherit
