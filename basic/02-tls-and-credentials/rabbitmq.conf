# RabbitMQ with TLS, using the certificates from ./generate-dev-certs.sh.
#
# Mounted at /etc/rabbitmq/rabbitmq.conf, with the certificates at
# /etc/rabbitmq/certs. The docker-compose file and the integration test both use
# this same file, so what the test proves is what a reader runs.

listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key

# The broker does not ask the client for a certificate: this example verifies the
# server, which is the common case. Mutual TLS would set these to verify_peer and
# true, and the client keystore would then be doing real work.
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
