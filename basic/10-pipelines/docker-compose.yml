# A broker for this example.
#
#   docker compose up -d
#   mvn compile exec:java
#
# Watch http://localhost:15672 (guest/guest) while it runs: one queue per step,
# so a backlog names the step that is slow.
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
