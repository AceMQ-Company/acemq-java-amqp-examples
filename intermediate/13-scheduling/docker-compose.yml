# A broker for this example.
#
#   docker compose up -d
#   mvn compile exec:java
#
# Watch http://localhost:15672 (guest/guest) while it runs: the five
# acemq.schedule.* queues appear, and a message can be seen moving down the
# ladder a rung at a time until it is due.
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
