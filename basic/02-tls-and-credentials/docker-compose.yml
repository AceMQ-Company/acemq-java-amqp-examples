# RabbitMQ with TLS, for this example.
#
#   mvn -Pgencert        # once — writes ./certs and ./certs/rabbitmq.conf
#   docker compose up -d
#   mvn compile exec:java
#
# The management UI is at http://localhost:15672 (guest/guest).
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"      # plaintext, for comparison
      - "5671:5671"      # TLS — what the example connects to
      - "15672:15672"
    volumes:
      # Both written by `mvn -Pgencert`. The generator emits the configuration as
      # well as the certificates, so the two cannot drift apart.
      - ./certs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./certs:/etc/rabbitmq/certs:ro
